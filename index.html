<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuenta regresiva 17 de noviembre</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Cuenta regresiva para el 17 de noviembre 🎉</h1>
    <div id="countdown">
      <div><span id="days">00</span><p>días</p></div>
      <div><span id="hours">00</span><p>horas</p></div>
      <div><span id="minutes">00</span><p>minutos</p></div>
      <div><span id="seconds">00</span><p>segundos</p></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
